name: 도서관 대출 상태 갱신

on:
  schedule:
    - cron: '17 */3 * * *'   # 3시간마다 (UTC 기준 17분)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'adds/**'
      - 'lib-titles.txt'
      - 'scripts/lib-*.mjs'
      - '.github/workflows/lib-status.yml'

permissions:
  contents: write

concurrency:
  group: lib-status
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 구로통합도서관 조회
        run: node scripts/lib-check.mjs
      - name: 바뀐 게 있으면 커밋
        run: |
          if git diff --quiet -- lib.json; then echo "변동 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib.json
          git commit -m "도서관 대출 상태 갱신"
          git pull --rebase origin main
          git push
